<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Projects That Turn Ideas Into Real Experiences — Siam.Dev</title>
    <meta
      name="description"
      content="A collection of websites, Shopify stores, landing pages, and custom web experiences built by Siam — Getambira, Midnights Menagerie, Beeldschoon, Homez and more."
    />
    <meta name="author" content="Siam" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://siam-portfolio.vercel.app/projects.html" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Projects That Turn Ideas Into Real Experiences — Siam.Dev"
    />
    <meta
      property="og:description"
      content="A collection of websites, Shopify stores, landing pages, and custom web experiences."
    />
    <meta property="og:url" content="https://siam-portfolio.vercel.app/projects.html" />
    <meta
      property="og:image"
      content="https://siam-portfolio.vercel.app/assets/images/Siam.png"
    />
    <meta property="og:image:width" content="1122" />
    <meta property="og:image:height" content="1402" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Projects That Turn Ideas Into Real Experiences — Siam.Dev"
    />
    <meta
      name="twitter:description"
      content="A collection of websites, Shopify stores, landing pages, and custom web experiences."
    />
    <meta
      name="twitter:image"
      content="https://siam-portfolio.vercel.app/assets/images/Siam.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme bootstrap: apply saved/system theme before paint (prevents flash) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("sd-theme");
          if (theme !== "dark" && theme !== "light") {
            theme = "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Page transition bootstrap: mark this page as entering so the
         veil fade-in animation runs from first paint (see css/style.css). -->
    <script>
      document.documentElement.classList.add("page-enter");
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="projects" data-base="">
    <!-- Navbar (shared component injected by js/site-layout.js) -->
    <header data-layout="header" class="site-header" id="site-header"></header>

    <div class="menu-overlay" id="menu-overlay" aria-hidden="true"></div>

    <main id="main">
      <!-- ======================= ALL PROJECTS HERO ======================= -->
      <section class="section projects-hero" id="all-projects" aria-label="All projects">
        <div class="container">
          <div class="projects-hero-inner reveal">
            <p class="eyebrow">My Work</p>
            <h1 class="section-title projects-hero-title">
              Projects That Turn Ideas Into<br />Real Experiences
            </h1>
            <p class="section-sub">
              A collection of websites, Shopify stores, landing pages, and
              custom web experiences built with modern technologies.
            </p>
          </div>
        </div>
      </section>

      <!-- ======================= PROJECT COLLECTION ======================= -->
      <section class="section section-alt" id="collection" aria-label="Project collection">
        <div class="container">
          <!-- Category tabs (built from project data by js/projects.js) -->
          <div class="tabs" role="tablist" aria-label="Project categories"></div>

          <div class="projects-swap">
            <div class="projects-grid" id="panel-all" data-panel="all"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer (shared component injected by js/site-layout.js) -->
    <footer data-layout="footer"></footer>

    <!-- Back to top -->
    <button class="back-to-top" id="back-to-top" aria-label="Back to top">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="18"
        height="18"
      >
        <path d="m18 15-6-6-6 6" />
      </svg>
    </button>

    <!-- Interactive background particle layer (JS-driven canvas, stays behind all content, never intercepts input) -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <!-- Custom cursor (enabled by JS only on fine-pointer, non-reduced-motion devices) -->
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>
    <div class="cursor-trail" aria-hidden="true"></div>

    <script src="js/site-layout.js"></script>
    <script src="js/script.js"></script>
    <script src="js/projects-data.js"></script>
    <script src="js/projects.js"></script>
  </body>
</html>
